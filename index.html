<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO - LO Monitoring System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #2563eb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

        .card, .so-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }

        h1 { margin-top: 0; }
        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        h3 { margin-top: 28px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: 5px; }

        input, select, button {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover { opacity: .92; }

        .product-choice {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .product-choice input[type="checkbox"] {
            width: auto;
            transform: scale(1.1);
        }

        .product-choice select {
            width: auto;
            min-width: 105px;
        }

        /* SPBU shading for LO product selector */
    #lo_so_product_select.spbu-select-blue {
      background-color: rgba(59,130,246,0.18);
      border-color: #3b82f6;
    }

    #lo_so_product_select.spbu-select-green {
      background-color: rgba(34,197,94,0.18);
      border-color: #22c55e;
    }

    /* SPBU dashboard shading */
    .so-card.spbu-green {
      background: linear-gradient(90deg, rgba(34,197,94,0.18), rgba(255,255,255,0.98) 42%);
      border-left: 6px solid #22c55e;
    }

    .so-card.spbu-blue {
      background: linear-gradient(90deg, rgba(59,130,246,0.18), rgba(255,255,255,0.98) 42%);
      border-left: 6px solid #3b82f6;
    }

    .so-card { margin-bottom: 16px; padding: 16px; }

        .so-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .so-header-left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

        .spbu-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            font-size: .78rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .product-row {
            margin-left: 12px;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: .85rem;
        }

        .status-belum { color: var(--danger); background: #fef2f2; }
        .status-tersisa { color: #b45309; background: #fffbeb; }
        .status-selesai { color: #047857; background: #ecfdf5; }

        .lo-item {
            margin-left: 24px;
            font-size: .9rem;
            color: #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            max-width: 650px;
            margin-top: 6px;
        }

        .divider {
            border-top: 3px double #94a3b8;
            margin: 32px 0;
            text-align: center;
            line-height: 0;
        }

        .divider span {
            background: var(--bg);
            padding: 0 12px;
            color: var(--muted);
            font-weight: 700;
        }

        .btn-del {
            width: auto;
            padding: 5px 9px;
            background: var(--danger);
            font-size: .78rem;
            white-space: nowrap;
        }

        .btn-del-so {
            margin-top: 12px;
            width: auto;
            padding: 7px 10px;
            background: var(--danger);
        }

        .empty-state {
            padding: 20px;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 8px;
            background: #fff;
        }


        /* EDITOR MODE */
        .editor-bar {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            background:#fff; border:1px solid var(--border); border-radius:10px;
            padding:12px 16px; margin-bottom:20px;
        }
        .editor-status { font-weight:700; color:#475569; }
        .editor-status.active { color:#047857; }
        .editor-actions { display:flex; gap:8px; flex-wrap:wrap; }
        .editor-actions button { width:auto; }
        .btn-editor { background:#475569; }
        .btn-lock { background:#334155; }
        .btn-edit { width:auto; padding:5px 9px; background:#f59e0b; font-size:.78rem; white-space:nowrap; }
        .editor-only { display:none; }
        body.editor-active .editor-only { display:inline-block; }
        .modal input, .modal select { margin-top:10px; }
        .modal small { display:block; margin-top:8px; color:#64748b; line-height:1.45; }

        /* CUSTOM CONFIRMATION MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, .55);
            z-index: 9999;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            width: min(430px, 100%);
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
            padding: 24px;
            animation: modalIn .18s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(8px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #fef2f2;
            color: var(--danger);
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .modal h3 { margin: 0 0 8px; font-size: 1.15rem; }
        .modal p { margin: 0; color: #475569; line-height: 1.55; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .modal-actions button { width: auto; min-width: 100px; }
        .btn-cancel { background: #e2e8f0; color: #334155; }
        .btn-confirm-delete { background: var(--danger); }

        @media (max-width: 800px) {
            body { padding: 12px; }
            .grid { grid-template-columns: 1fr; }
            .so-header { align-items: flex-start; flex-direction: column; }
            .lo-item { margin-left: 0; }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>SO–LO Monitoring System</h1>

    <div class="editor-bar">
        <div>
            <div id="editorStatus" class="editor-status">🔒 Mode Editor Terkunci</div>
            <small id="editorTimer" style="color:#64748b"></small>
        </div>
        <div class="editor-actions">
            <button type="button" class="btn-editor" id="openEditorBtn">🔒 Mode Editor</button>
            <button type="button" class="btn-lock editor-only" id="lockEditorBtn">🔒 Kunci Sekarang</button>
            <button type="button" class="btn-editor" id="changePinBtn">⚙️ Atur PIN</button>
        </div>
    </div>


    <div class="grid">
        <!-- FORM INPUT SO -->
        <div class="card">
            <h2>Input Sales Order (SO)</h2>

            <form id="formSO">
                <div class="form-group">
                    <label for="so_number">Nomor SO</label>
                    <input type="text" id="so_number" required placeholder="Masukkan Nomor SO">
                </div>

                <div class="form-group">
                    <label for="so_spbu">SPBU</label>
                    <select id="so_spbu" required>
                        <option value="SPBU-74.906.16">SPBU-74.906.16</option>
                        <option value="SPBU-74.906.07">SPBU-74.906.07</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="so_date">Tanggal SO</label>
                    <input type="date" id="so_date" required>
                </div>

                <div class="form-group">
                    <label>Pilih Produk & Quantity (KL)</label>

                    <div id="productsInput">
                        <div class="product-choice">
                            <input type="checkbox" value="Pertalite" class="prod-check" id="prod_pertalite">
                            <label for="prod_pertalite">Pertalite:</label>
                            <select class="prod-qty" data-prod="Pertalite">
                                <option value="8">8 KL</option>
                                <option value="16">16 KL</option>
                                <option value="24">24 KL</option>
                            </select>
                        </div>

                        <div class="product-choice">
                            <input type="checkbox" value="Biosolar" class="prod-check" id="prod_biosolar">
                            <label for="prod_biosolar">Biosolar:</label>
                            <select class="prod-qty" data-prod="Biosolar">
                                <option value="8">8 KL</option>
                                <option value="16">16 KL</option>
                                <option value="24">24 KL</option>
                            </select>
                        </div>

                        <div class="product-choice">
                            <input type="checkbox" value="Pertamax" class="prod-check" id="prod_pertamax">
                            <label for="prod_pertamax">Pertamax:</label>
                            <select class="prod-qty" data-prod="Pertamax">
                                <option value="8">8 KL</option>
                                <option value="16">16 KL</option>
                                <option value="24">24 KL</option>
                            </select>
                        </div>

                        <div class="product-choice">
                            <input type="checkbox" value="Dexlite" class="prod-check" id="prod_dexlite">
                            <label for="prod_dexlite">Dexlite:</label>
                            <select class="prod-qty" data-prod="Dexlite">
                                <option value="4">4 KL</option>
                                <option value="8">8 KL</option>
                                <option value="16">16 KL</option>
                                <option value="24">24 KL</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit">Simpan SO</button>
            </form>
        </div>

        <!-- FORM INPUT LO -->
        <div class="card">
            <h2>Input Loading Order (LO)</h2>

            <form id="formLO">
                <div class="form-group">
                    <label for="lo_number">Nomor LO</label>
                    <input type="text" id="lo_number" required placeholder="Masukkan Nomor LO">
                </div>

                <div class="form-group">
                    <label for="lo_date">Tanggal LO</label>
                    <input type="date" id="lo_date" required>
                </div>

                <div class="form-group">
                    <label for="lo_so_product_select">Pilih SO & Produk Terkait</label>
                    <select id="lo_so_product_select" required>
                        <option value="">-- Pilih SO Produk --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lo_quantity">Quantity LO (KL)</label>
                    <select id="lo_quantity" required>
                        <option value="8">8 KL</option>
                        <option value="4">4 KL (Khusus Dexlite)</option>
                    </select>
                </div>

                <button type="submit">Simpan LO</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD DISPLAY -->
    <h2>Dashboard Monitoring</h2>

    <h3>Bagian 1 — SO Aktif</h3>
    <div id="dashboardActive">Loading data...</div>

    <div class="divider"><span>SO SELESAI</span></div>

    <h3>Bagian 2 — SO Selesai</h3>
    <div id="dashboardCompleted">Loading data...</div>
</div>


<!-- EDITOR / PIN MODAL -->
<div class="modal-overlay" id="pinModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-icon">🔐</div>
        <h3 id="pinModalTitle">Mode Editor</h3>
        <p id="pinModalMessage"></p>
        <input type="password" id="pinInput" inputmode="numeric" autocomplete="current-password" placeholder="Masukkan PIN">
        <small id="pinModalHint"></small>
        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="pinCancelBtn">Batal</button>
            <button type="button" class="btn-editor" id="pinSubmitBtn">Lanjutkan</button>
        </div>
    </div>
</div>

<!-- EDIT DATA MODAL -->
<div class="modal-overlay" id="editModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-icon">✏️</div>
        <h3 id="editModalTitle">Edit Data</h3>
        <p id="editModalMessage"></p>
        <div id="editModalFields"></div>
        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="editCancelBtn">Batal</button>
            <button type="button" class="btn-editor" id="editSaveBtn">Simpan Perubahan</button>
        </div>
    </div>
</div>

<!-- CUSTOM DELETE CONFIRMATION MODAL -->
<div class="modal-overlay" id="deleteModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
        <div class="modal-icon">🗑</div>
        <h3 id="deleteModalTitle">Konfirmasi Hapus</h3>
        <p id="deleteModalMessage"></p>

        <div class="modal-actions">
            <button type="button" class="btn-cancel" id="deleteCancelBtn">Batal</button>
            <button type="button" class="btn-confirm-delete" id="deleteConfirmBtn">Ya, Hapus</button>
        </div>
    </div>
</div>

<script>
    // =========================
    // INITIALIZE SUPABASE
    // =========================
    const SUPABASE_URL = "https://gkeqbivbnywjvwykhobj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-yHkp6xzWRBnBFK7_YmzCg_wnMvw6Mo";

    const sb = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    // =========================
    // DEFAULT DATES
    // =========================
    function setDefaultDates() {
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById('so_date').value = today;
        document.getElementById('lo_date').value = today;
    }

    setDefaultDates();

    // =========================
    // CUSTOM CONFIRMATION MODAL
    // =========================
    const deleteModal = document.getElementById('deleteModal');
    const deleteModalTitle = document.getElementById('deleteModalTitle');
    const deleteModalMessage = document.getElementById('deleteModalMessage');
    const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
    const deleteCancelBtn = document.getElementById('deleteCancelBtn');

    let pendingDeleteAction = null;

    function openDeleteModal(title, message, action) {
        pendingDeleteAction = action;
        deleteModalTitle.textContent = title;
        deleteModalMessage.textContent = message;
        deleteModal.classList.add('show');
        deleteModal.setAttribute('aria-hidden', 'false');
        deleteCancelBtn.focus();
    }

    function closeDeleteModal() {
        pendingDeleteAction = null;
        deleteModal.classList.remove('show');
        deleteModal.setAttribute('aria-hidden', 'true');
    }

    deleteCancelBtn.addEventListener('click', closeDeleteModal);

    deleteModal.addEventListener('click', (event) => {
        if (event.target === deleteModal) closeDeleteModal();
    });

    deleteConfirmBtn.addEventListener('click', async () => {
        const action = pendingDeleteAction;
        closeDeleteModal();

        if (typeof action === 'function') {
            await action();
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && deleteModal.classList.contains('show')) {
            closeDeleteModal();
        }
    });

    // =========================
    // LOAD DATA & DASHBOARD
    // =========================
    async function fetchDashboard() {
        const activeContainer = document.getElementById('dashboardActive');
        const completedContainer = document.getElementById('dashboardCompleted');
        const loSelect = document.getElementById('lo_so_product_select');

        activeContainer.innerHTML = 'Loading data...';
        completedContainer.innerHTML = 'Loading data...';
        loSelect.innerHTML = '<option value="">-- Pilih SO Produk --</option>';

        try {
            if (!window.supabase || !sb || typeof sb.from !== 'function') {
                throw new Error('Supabase client tidak berhasil diinisialisasi.');
            }

            const { data: soList, error } = await sb
                .from('so')
                .select(`
                    id,
                    nomor_so,
                    tanggal_so,
                    spbu,
                    completed_at,
                    deleted_at,
                    so_products (
                        id,
                        product_name,
                        quantity_so,
                        lo (
                            id,
                            nomor_lo,
                            tanggal_lo,
                            quantity_lo,
                            deleted_at
                        )
                    )
                `)
                .is('deleted_at', null);

            if (error) throw error;

            const safeList = soList || [];

            activeContainer.innerHTML = '';
            completedContainer.innerHTML = '';
            loSelect.innerHTML = '<option value="">-- Pilih SO Produk --</option>';

            const activeSOs = safeList
                .filter(so => !so.completed_at)
                .sort((a, b) => new Date(a.tanggal_so) - new Date(b.tanggal_so));

            const completedSOs = safeList
                .filter(so => so.completed_at)
                .sort((a, b) => new Date(b.completed_at) - new Date(a.completed_at));

            function renderSO(so, targetEl, isActive) {
                const spbuShadeClass =
                    so.spbu === 'SPBU-74.906.16' ? ' spbu-green' :
                    so.spbu === 'SPBU-74.906.07' ? ' spbu-blue' : '';

                const products = so.so_products || [];

                let html = `
                    <div class="so-card${spbuShadeClass}">
                        <div class="so-header">
                            <div class="so-header-left">
                                <span>SO: ${escapeHtml(so.nomor_so)}</span>
                                ${so.spbu ? `<span class="spbu-badge">${escapeHtml(so.spbu)}</span>` : ''}
                            </div>
                            <span style="font-size:.85rem;color:#64748b;font-weight:600">
                                ${formatDate(so.tanggal_so)}
                            </span>
                        </div>
                `;

                products.forEach(prod => {
                    const activeLOs = (prod.lo || []).filter(lo => !lo.deleted_at);
                    const totalLO = activeLOs.reduce((sum, lo) => sum + Number(lo.quantity_lo || 0), 0);
                    const sisa = Number(prod.quantity_so) - totalLO;

                    let statusHtml = '';
                    if (totalLO === 0) {
                        statusHtml = '<span class="status-badge status-belum">Belum Terkirim</span>';
                    } else if (totalLO < prod.quantity_so) {
                        statusHtml = `<span class="status-badge status-tersisa">Sisa ${sisa} KL</span>`;
                    } else {
                        statusHtml = '<span class="status-badge status-selesai">Selesai</span>';
                    }

                    if (isActive && totalLO < prod.quantity_so) {
                        const option = document.createElement('option');
                        option.value = prod.id;
                        option.dataset.product = prod.product_name || '';
                        option.dataset.remaining = String(sisa);
                        option.dataset.spbu = so.spbu || '';

                        // Shading pilihan berdasarkan SPBU
                        if (so.spbu === 'SPBU-74.906.07') {
                            option.style.backgroundColor = '#dbeafe';
                        } else if (so.spbu === 'SPBU-74.906.16') {
                            option.style.backgroundColor = '#dcfce7';
                        }

                        option.textContent = `${so.nomor_so}${so.spbu ? ' | ' + so.spbu : ''} | ${prod.product_name} | Sisa: ${sisa} KL`;
                        loSelect.appendChild(option);
                    }

                    html += `
                        <div class="product-row">
                            <strong>${escapeHtml(prod.product_name)} — ${prod.quantity_so} KL</strong>
                            <div style="margin-top:4px">
                                Terkirim ${totalLO}/${prod.quantity_so} KL
                                ${statusHtml}
                            </div>
                    `;

                    activeLOs.forEach(lo => {
                        html += `
                            <div class="lo-item">
                                <span>
                                    LO ${escapeHtml(lo.nomor_lo)}
                                    (${formatDate(lo.tanggal_lo)})
                                    : ${lo.quantity_lo} KL
                                </span>
                                <button type="button" class="btn-edit editor-only" onclick="openEditLO('${lo.id}', '${escapeJs(lo.nomor_lo)}', ${lo.quantity_lo})">Edit</button>
                                <button type="button" class="btn-del editor-only" onclick="confirmDeleteLO('${lo.id}', '${escapeJs(lo.nomor_lo)}')">Hapus</button>
                            </div>
                        `;
                    });

                    html += '</div>';
                });

                html += `
                    <button type="button" class="btn-edit editor-only" onclick="openEditSO('${so.id}', '${escapeJs(so.nomor_so)}', '${so.tanggal_so}', '${escapeJs(so.spbu || '')}')">Edit SO</button>
                    <button type="button" class="btn-del-so editor-only" onclick="confirmDeleteSO('${so.id}', '${escapeJs(so.nomor_so)}')">Soft Delete SO</button>
                </div>
                `;

                targetEl.insertAdjacentHTML('beforeend', html);
            }

            if (activeSOs.length === 0) {
                activeContainer.innerHTML = '<div class="empty-state">Belum ada SO aktif.</div>';
            } else {
                activeSOs.forEach(so => renderSO(so, activeContainer, true));
            }

            if (completedSOs.length === 0) {
                completedContainer.innerHTML = '<div class="empty-state">Belum ada SO selesai.</div>';
            } else {
                completedSOs.forEach(so => renderSO(so, completedContainer, false));
            }

        } catch (error) {
            console.error('fetchDashboard error:', error);
            const message = error?.message || String(error);
            activeContainer.innerHTML = `<div class="empty-state" style="color:#b91c1c;border-color:#fecaca;background:#fff1f2;"><strong>Gagal memuat dashboard.</strong><br>${escapeHtml(message)}</div>`;
            completedContainer.innerHTML = '';
            loSelect.innerHTML = '<option value="">-- Pilih SO Produk --</option>';
        }
    }

    // =========================
    // SHADING SPBU PADA PILIHAN LO
    // =========================
    document.getElementById('lo_so_product_select').addEventListener('change', function () {
        this.classList.remove('spbu-select-blue', 'spbu-select-green');

        const selected = this.options[this.selectedIndex];
        const spbu = selected?.dataset?.spbu || '';

        if (spbu === 'SPBU-74.906.07') {
            this.classList.add('spbu-select-blue');
        } else if (spbu === 'SPBU-74.906.16') {
            this.classList.add('spbu-select-green');
        }
    });

    // =========================
    // FORM HANDLER: CREATE SO
    // =========================
    document.getElementById('formSO').addEventListener('submit', async (event) => {
        event.preventDefault();

        const nomor_so = document.getElementById('so_number').value.trim();
        const tanggal_so = document.getElementById('so_date').value;
        const spbu = document.getElementById('so_spbu').value;

        const selectedProducts = [];

        document.querySelectorAll('.prod-check:checked').forEach(cb => {
            const product_name = cb.value;
            const quantity_so = Number(
                document.querySelector(`.prod-qty[data-prod="${product_name}"]`).value
            );

            selectedProducts.push({ product_name, quantity_so });
        });

        if (!selectedProducts.length) {
            alert('Pilih minimal satu produk.');
            return;
        }

        const { data: soData, error: soErr } = await sb
            .from('so')
            .insert([{ nomor_so, tanggal_so, spbu }])
            .select()
            .single();

        if (soErr) {
            alert('Gagal Simpan SO: ' + soErr.message);
            return;
        }

        const productsToInsert = selectedProducts.map(product => ({
            ...product,
            so_id: soData.id
        }));

        const { error: prodErr } = await sb
            .from('so_products')
            .insert(productsToInsert);

        if (prodErr) {
            // Best-effort rollback so an incomplete SO is not left behind.
            await sb.from('so').update({ deleted_at: new Date().toISOString() }).eq('id', soData.id);
            alert('Gagal Simpan Produk SO: ' + prodErr.message);
            return;
        }

        alert('SO berhasil disimpan.');
        document.getElementById('formSO').reset();
        setDefaultDates();
        await fetchDashboard();
    });

    // =========================
    // FORM HANDLER: CREATE LO
    // =========================
    document.getElementById('formLO').addEventListener('submit', async (event) => {
        event.preventDefault();

        const p_nomor_lo = document.getElementById('lo_number').value.trim();
        const p_tanggal_lo = document.getElementById('lo_date').value;
        const p_so_product_id = document.getElementById('lo_so_product_select').value;
        const p_quantity_lo = Number(document.getElementById('lo_quantity').value);

        if (!p_so_product_id) {
            alert('Pilih SO dan produk terlebih dahulu.');
            return;
        }

        const selectedOption = document.getElementById('lo_so_product_select').selectedOptions[0];
        const productName = selectedOption.dataset.product;
        const remaining = Number(selectedOption.dataset.remaining);

        if (p_quantity_lo === 4 && productName !== 'Dexlite') {
            alert('Quantity 4 KL hanya dapat digunakan untuk Dexlite.');
            return;
        }

        if (p_quantity_lo > remaining) {
            alert(`Quantity LO ${p_quantity_lo} KL melebihi sisa ${remaining} KL.`);
            return;
        }

        const { error } = await sb.rpc('create_lo_atomic', {
            p_nomor_lo,
            p_so_product_id,
            p_tanggal_lo,
            p_quantity_lo
        });

        if (error) {
            alert('Gagal Simpan LO: ' + error.message);
            return;
        }

        alert('LO berhasil ditambahkan.');
        document.getElementById('formLO').reset();
        setDefaultDates();
        await fetchDashboard();
    });

    // =========================
    // SOFT DELETE WITH CUSTOM CONFIRMATION
    // =========================
    function confirmDeleteLO(loId, nomorLO) {
        openDeleteModal(
            'Hapus Loading Order?',
            `Yakin ingin melakukan soft delete untuk LO ${nomorLO}? Data tidak dihapus permanen, tetapi tidak lagi dihitung sebagai LO aktif.`,
            async () => {
                const { error } = await sb
                    .from('lo')
                    .update({ deleted_at: new Date().toISOString() })
                    .eq('id', loId);

                if (error) {
                    alert('Gagal menghapus LO: ' + error.message);
                    return;
                }

                await fetchDashboard();

        );

    function confirmDeleteSO(soId, nomorSO) {
        openDeleteModal(
            'Hapus Sales Order?',
            `Yakin ingin melakukan soft delete untuk SO ${nomorSO}? SO dan produknya tidak akan tampil lagi pada dashboard aktif maupun selesai.`,
            async () => {
                const { error } = await sb
                    .from('so')
                    .update({ deleted_at: new Date().toISOString() })
                    .eq('id', soId);

                if (error) {
                    alert('Gagal menghapus SO: ' + error.message);
                    return;
                }

                await fetchDashboard();
            }
        );
    }


    // =========================
    // EDITOR MODE + PIN
    // PIN is stored only as SHA-256 hash in localStorage.
    // For stronger multi-user/server-side enforcement, pair this UI with Supabase Auth/RPC.
    // =========================
    const EDITOR_DURATION_MS = 10 * 60 * 1000;
    let editorUnlockedUntil = 0;
    let editorTimerHandle = null;
    let pinAction = null;
    let pendingEdit = null;

    const pinModal = document.getElementById('pinModal');
    const pinModalTitle = document.getElementById('pinModalTitle');
    const pinModalMessage = document.getElementById('pinModalMessage');
    const pinModalHint = document.getElementById('pinModalHint');
    const pinInput = document.getElementById('pinInput');
    const pinSubmitBtn = document.getElementById('pinSubmitBtn');
    const pinCancelBtn = document.getElementById('pinCancelBtn');

    const editModal = document.getElementById('editModal');
    const editModalTitle = document.getElementById('editModalTitle');
    const editModalMessage = document.getElementById('editModalMessage');
    const editModalFields = document.getElementById('editModalFields');
    const editSaveBtn = document.getElementById('editSaveBtn');
    const editCancelBtn = document.getElementById('editCancelBtn');

    function getStoredPinHash() { return localStorage.getItem('solo_editor_pin_hash'); }

    async function sha256(text) {
        const data = new TextEncoder().encode(text);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function validPin(pin) {
        return /^\d{4,12}$/.test(pin);
    }

    function openPinModal(action, title, message, hint = '') {
        pinAction = action;
        pinModalTitle.textContent = title;
        pinModalMessage.textContent = message;
        pinModalHint.textContent = hint;
        pinInput.value = '';
        pinInput.type = 'password';
        pinModal.classList.add('show');
        pinModal.setAttribute('aria-hidden', 'false');
        setTimeout(() => pinInput.focus(), 30);
    }

    function closePinModal() {
        pinAction = null;
        pinModal.classList.remove('show');
        pinModal.setAttribute('aria-hidden', 'true');
    }

    async function activateEditor() {
        editorUnlockedUntil = Date.now() + EDITOR_DURATION_MS;
        document.body.classList.add('editor-active');
        updateEditorStatus();
        if (editorTimerHandle) clearInterval(editorTimerHandle);
        editorTimerHandle = setInterval(updateEditorStatus, 1000);
        await fetchDashboard();
    }

    function lockEditor() {
        editorUnlockedUntil = 0;
        document.body.classList.remove('editor-active');
        if (editorTimerHandle) clearInterval(editorTimerHandle);
        editorTimerHandle = null;
        document.getElementById('editorStatus').textContent = '🔒 Mode Editor Terkunci';
        document.getElementById('editorStatus').classList.remove('active');
        document.getElementById('editorTimer').textContent = '';
    }

    function updateEditorStatus() {
        const remaining = editorUnlockedUntil - Date.now();
        if (remaining <= 0) {
            lockEditor();
            return;
        }
        const totalSec = Math.ceil(remaining / 1000);
        const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const sec = String(totalSec % 60).padStart(2, '0');
        const status = document.getElementById('editorStatus');
        status.textContent = '🟢 Mode Editor Aktif';
        status.classList.add('active');
        document.getElementById('editorTimer').textContent = `Terkunci otomatis dalam ${min}:${sec}`;
    }

    function ensureEditor() {
        if (editorUnlockedUntil > Date.now()) return true;
        lockEditor();
        alert('Mode Editor terkunci. Aktifkan kembali untuk melakukan perubahan.');
        return false;
    }

    document.getElementById('openEditorBtn').addEventListener('click', async () => {
        if (!getStoredPinHash()) {
            openPinModal('create', 'Buat PIN Editor', 'Belum ada PIN Editor. Buat PIN baru untuk melindungi perubahan data.', 'Gunakan 4–12 angka.');
        } else {
            openPinModal('unlock', 'Buka Mode Editor', 'Masukkan PIN untuk membuka akses perubahan data selama 10 menit.');
        }
    });

    document.getElementById('changePinBtn').addEventListener('click', () => {
        if (!getStoredPinHash()) {
            openPinModal('create', 'Buat PIN Editor', 'Buat PIN baru untuk Mode Editor.', 'Gunakan 4–12 angka.');
        } else {
            openPinModal('change-verify', 'Ubah PIN Editor', 'Masukkan PIN lama terlebih dahulu.');
        }
    });

    document.getElementById('lockEditorBtn').addEventListener('click', lockEditor);
    pinCancelBtn.addEventListener('click', closePinModal);

    pinModal.addEventListener('click', (e) => {
        if (e.target === pinModal) closePinModal();
    });

    pinSubmitBtn.addEventListener('click', async () => {
        const pin = pinInput.value.trim();
        if (!validPin(pin)) {
            pinModalHint.textContent = 'PIN harus terdiri dari 4 sampai 12 angka.';
            return;
        }

        const hash = await sha256(pin);
        const existing = getStoredPinHash();

        if (pinAction === 'create') {
            localStorage.setItem('solo_editor_pin_hash', hash);
            closePinModal();
            alert('PIN Editor berhasil dibuat.');
            await activateEditor();
            return;
        }

        if (pinAction === 'unlock') {
            if (hash !== existing) {
                pinModalHint.textContent = 'PIN salah.';
                return;
            }
            closePinModal();
            await activateEditor();
            return;
        }

        if (pinAction === 'change-verify') {
            if (hash !== existing) {
                pinModalHint.textContent = 'PIN lama salah.';
                return;
            }
            pinAction = 'change-new';
            pinModalTitle.textContent = 'Buat PIN Baru';
            pinModalMessage.textContent = 'Masukkan PIN baru untuk Mode Editor.';
            pinModalHint.textContent = 'Gunakan 4–12 angka.';
            pinInput.value = '';
            return;
        }

        if (pinAction === 'change-new') {
            localStorage.setItem('solo_editor_pin_hash', hash);
            closePinModal();
            alert('PIN Editor berhasil diubah.');
        }
    });

    // =========================
    // EDIT SO / LO
    // =========================
    function openEditModal(title, message, fieldsHtml, saveAction) {
        if (!ensureEditor()) return;
        pendingEdit = saveAction;
        editModalTitle.textContent = title;
        editModalMessage.textContent = message;
        editModalFields.innerHTML = fieldsHtml;
        editModal.classList.add('show');
        editModal.setAttribute('aria-hidden', 'false');
    }

    function closeEditModal() {
        pendingEdit = null;
        editModal.classList.remove('show');
        editModal.setAttribute('aria-hidden', 'true');
    }

    editCancelBtn.addEventListener('click', closeEditModal);
    editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeEditModal();
    });

    editSaveBtn.addEventListener('click', async () => {
        if (!ensureEditor()) return;
        if (typeof pendingEdit === 'function') await pendingEdit();
    });

    async function openEditLO(loId, nomorLO, currentQty) {
        openEditModal(
            'Edit Loading Order',
            `Ubah data LO ${nomorLO}. Nomor LO dapat diperbaiki tanpa membuat record baru.`,
            `
                <label>Nomor LO</label>
                <input id="edit_lo_nomor" value="${escapeHtml(nomorLO)}" maxlength="100">
                <label style="margin-top:12px">Quantity LO</label>
                <select id="edit_lo_qty">
                    <option value="4" ${Number(currentQty)===4?'selected':''}>4 KL</option>
                    <option value="8" ${Number(currentQty)===8?'selected':''}>8 KL</option>
                </select>
            `,
            async () => {
                const nomor_lo = document.getElementById('edit_lo_nomor').value.trim();
                const quantity_lo = Number(document.getElementById('edit_lo_qty').value);
                if (!nomor_lo) { alert('Nomor LO wajib diisi.'); return; }

                const { data: current, error: readErr } = await sb
                    .from('lo')
                    .select('id, so_product_id, quantity_lo, so_products(quantity_so, product_name)')
                    .eq('id', loId)
                    .single();

                if (readErr) { alert('Gagal membaca LO: ' + readErr.message); return; }

                const product = Array.isArray(current.so_products) ? current.so_products[0] : current.so_products;
                if (quantity_lo === 4 && product.product_name !== 'Dexlite') {
                    alert('Quantity 4 KL hanya diperbolehkan untuk Dexlite.');
                    return;
                }

                const { data: siblings, error: sumErr } = await sb
                    .from('lo')
                    .select('quantity_lo')
                    .eq('so_product_id', current.so_product_id)
                    .is('deleted_at', null)
                    .neq('id', loId);

                if (sumErr) { alert('Gagal memvalidasi total LO: ' + sumErr.message); return; }

                const otherTotal = (siblings || []).reduce((s, x) => s + Number(x.quantity_lo || 0), 0);
                if (otherTotal + quantity_lo > Number(product.quantity_so)) {
                    alert(`Perubahan ditolak: total LO akan menjadi ${otherTotal + quantity_lo} KL, melebihi SO ${product.quantity_so} KL.`);
                    return;
                }

                const { error } = await sb
                    .from('lo')
                    .update({ nomor_lo, quantity_lo, updated_at: new Date().toISOString() })
                    .eq('id', loId);

                if (error) { alert('Gagal menyimpan perubahan LO: ' + error.message); return; }
                closeEditModal();
                await fetchDashboard();
            }
        );
    }

    async function openEditSO(soId, nomorSO, tanggalSO, currentSpbu) {
        openEditModal(
            'Edit Sales Order',
            `Ubah informasi dasar SO ${nomorSO}. Quantity produk dikelola terpisah agar validasi terhadap LO tetap aman.`,
            `
                <label>Nomor SO</label>
                <input id="edit_so_nomor" value="${escapeHtml(nomorSO)}" maxlength="100">
                <label style="margin-top:12px">Tanggal SO</label>
                <input type="date" id="edit_so_tanggal" value="${escapeHtml(tanggalSO)}">
                <label style="margin-top:12px">SPBU</label>
                <select id="edit_so_spbu">
                    <option value="SPBU-74.906.16" ${currentSpbu==='SPBU-74.906.16'?'selected':''}>SPBU-74.906.16</option>
                    <option value="SPBU-74.906.07" ${currentSpbu==='SPBU-74.906.07'?'selected':''}>SPBU-74.906.07</option>
                </select>
            `,
            async () => {
                const nomor_so = document.getElementById('edit_so_nomor').value.trim();
                const tanggal_so = document.getElementById('edit_so_tanggal').value;
                const spbu = document.getElementById('edit_so_spbu').value;
                if (!nomor_so || !tanggal_so || !spbu) { alert('Semua data wajib diisi.'); return; }

                const { error } = await sb
                    .from('so')
                    .update({ nomor_so, tanggal_so, spbu, updated_at: new Date().toISOString() })
                    .eq('id', soId);

                if (error) { alert('Gagal menyimpan perubahan SO: ' + error.message); return; }
                closeEditModal();
                await fetchDashboard();
            }
        );
    }


    // =========================
    // HELPERS
    // =========================
    function formatDate(value) {
        if (!value) return '-';
        return new Date(value + (value.length === 10 ? 'T00:00:00' : '')).toLocaleDateString('id-ID');
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function escapeJs(value) {
        return String(value ?? '')
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'");
    }

    // =========================
    // INITIAL FETCH & REALTIME
    // =========================
    fetchDashboard();

    sb.channel('schema-db-changes')
        .on(
            'postgres_changes',
            { event: '*', schema: 'public' },
            () => fetchDashboard()
        )
        .subscribe();
</script>
